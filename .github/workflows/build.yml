name: Build

on:
  push:
    branches:
      - main
      - "1.21.1"
      - "mc/**"
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: thaumic-bases-reforged

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: thaumic-bases-reforged

      - name: Read versions
        id: props
        run: |
          version="$(sed -nE "s/^version = '([^']+)'.*/\1/p" build.gradle)"
          java="$(sed -nE 's/.*JavaLanguageVersion\.of\(([0-9]+)\).*/\1/p' build.gradle)"
          tc_jar="$(grep -oE "libs/thaumcraft-4-reforged-[^']+\.jar" build.gradle | head -1)"
          mc="${version##*+}"
          if [ "$mc" = "26.3" ]; then base=main; else base="mc/$mc"; fi
          test -n "$version" && test -n "$java" && test -n "$tc_jar"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "java=$java" >> "$GITHUB_OUTPUT"
          echo "mc=$mc" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "tc_jar=$tc_jar" >> "$GITHUB_OUTPUT"

      - name: Checkout Thaumcraft
        uses: actions/checkout@v5
        with:
          repository: notlikethiss/thaumcraft-4-reforged
          ref: ${{ steps.props.outputs.base }}
          path: thaumcraft-4-reforged

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ steps.props.outputs.java }}

      - uses: gradle/actions/setup-gradle@v5

      - name: Build Thaumcraft
        working-directory: thaumcraft-4-reforged
        run: |
          chmod +x gradlew
          ./gradlew jar
          ls build/libs

      - name: Copy Thaumcraft jar
        env:
          TC_JAR: ${{ steps.props.outputs.tc_jar }}
        run: |
          mkdir -p libs
          src="$(ls ../thaumcraft-4-reforged/build/libs/thaumcraft-4-reforged-*.jar | grep -vE -- '-(sources|javadoc)\.jar$' | head -1)"
          test -f "$src"
          cp "$src" "$TC_JAR"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          MC: ${{ steps.props.outputs.mc }}
          VERSION: ${{ steps.props.outputs.version }}
        run: |
          tag="$MC"
          jar="$(ls build/libs/*.jar | grep -vE -- '-(sources|javadoc)\.jar$' | head -1)"
          test -f "$jar"
          notes="$(git log -1 --format='%h: %s')"
          latest=false
          if [ "$GITHUB_REF_NAME" = "main" ]; then latest=true; fi
          git tag -f "$tag" "$GITHUB_SHA"
          git push -f origin "refs/tags/$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$MC" --notes "$notes" --latest="$latest"
            for asset in $(gh release view "$tag" --json assets --jq '.assets[].name'); do
              if [ "$asset" != "$(basename "$jar")" ]; then gh release delete-asset "$tag" "$asset" --yes; fi
            done
            gh release upload "$tag" "$jar" --clobber
          else
            gh release create "$tag" "$jar" --latest="$latest" --verify-tag --title "$MC" --notes "$notes"
          fi
